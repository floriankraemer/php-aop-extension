name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  # The release workflow runs the whole suite on the tagged commit before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        ts: [nts, zts]
    env:
      # setup-php reads the thread-safety choice from this variable.
      phpts: ${{ matrix.ts }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, phpize, php-config
          coverage: none

      - name: PHP info
        run: |
          php -v
          php -r 'echo "ZTS: ", PHP_ZTS ? "yes" : "no", PHP_EOL;'

      - name: Build extension
        run: make ext

      - name: Run phpt suite
        run: make test-ext

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPUnit unit suite
        run: vendor/bin/phpunit --testsuite unit

      - name: PHPUnit e2e suite (with extension)
        run: |
          if [ -d tests/E2E ]; then
            php -d "extension=$PWD/ext/modules/aop.so" vendor/bin/phpunit --testsuite e2e
          else
            echo "tests/E2E not present yet, skipping"
          fi

      - name: Examples match their documented output
        run: php scripts/check-examples.php "php -d extension=$PWD/ext/modules/aop.so"

      # Static analysis and style do not depend on PHP build flavour: run once.
      - name: PHPStan
        if: matrix.php == '8.3' && matrix.ts == 'nts'
        run: composer stan

      - name: PHP CS Fixer
        if: matrix.php == '8.3' && matrix.ts == 'nts'
        run: composer cs

  # Quality gate: line coverage of src/ (unit + e2e, pcov) and of ext/*.c (phpt, gcov) must stay at or above
  # COVERAGE_MIN in the Makefile. One flavour is enough: coverage does not depend on PHP version or thread safety.
  coverage:
    name: Coverage gate (PHP 8.3 nts)
    runs-on: ubuntu-24.04
    env:
      phpts: nts
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer, phpize, php-config
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install gcovr
        run: pipx install gcovr

      - name: PHP coverage (fails below the minimum)
        run: make coverage-php

      - name: C coverage (fails below the minimum)
        run: make coverage-c

      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: build/coverage/
          if-no-files-found: ignore

  valgrind:
    name: Valgrind PHP ${{ matrix.php }} nts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none

      - name: Build extension
        run: make ext

      - name: Run phpt under valgrind
        working-directory: ext
        env:
          NO_INTERACTION: "1"
          REPORT_EXIT_STATUS: "1"
          USE_ZEND_ALLOC: "0"
          TEST_PHP_ARGS: "-m -q"
        run: make test

  # Same matrix as the macOS jobs in release.yml, so a release cannot fail on a combination CI never ran.
  # arm64 only: Intel Macs are end of life (macOS 26 is the last release) and Homebrew has dropped them to tier 3.
  macos:
    name: macOS arm64 PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        ts: [nts, ts]
    env:
      phpts: ${{ matrix.ts }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none

      - name: Build extension
        run: make ext

      - name: Run phpt suite
        run: make test-ext

      - name: Show phpt failure details
        if: failure()
        run: |
          for f in ext/tests/*.diff; do
            [ -e "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

  windows:
    name: Windows x64 PHP ${{ matrix.php }} nts
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]
    steps:
      - uses: actions/checkout@v7

      # The builder has no working-directory input, and with config.w32 in a subdirectory it moves the sources
      # into its build directory but still reads config.w32 from the workspace root. Make the workspace the
      # extension; .git stays so the builder accepts the checkout instead of checking out the repo again.
      - name: Make ext/ the workspace root
        shell: pwsh
        run: |
          Get-ChildItem -Force | Where-Object { $_.Name -notin '.git', 'ext' } | Remove-Item -Recurse -Force
          Get-ChildItem -Force ext | Move-Item -Destination .
          Remove-Item ext

      - name: Build and test extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php }}
          arch: x64
          ts: nts
          # The builder only derives configure options from PIE metadata in composer.json, which ext/ has none of.
          args: --enable-aop=shared
          # The builder names files after the ref, and a branch name with "/" makes that an invalid path.
          extension-ref: ${{ github.sha }}
          run-tests: "true"
