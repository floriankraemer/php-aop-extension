services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_TAG: ${PHP_TAG:-8.3-cli-bookworm}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: php-aop-extension-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - composer-cache:/home/developer/.composer
    # gdb needs ptrace; valgrind works without extra privileges.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    tty: true
    stdin_open: true

volumes:
  composer-cache:
